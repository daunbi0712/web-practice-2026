<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>쇼핑몰</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="ddd">
        <div class="logo">MY SHOP</div>
        <ul class="aaa">
            <li>HOME</li>
            <li>NEW</li>
            <li>SALE</li>
            <li>CONTACT</li>
        </ul>
        <div class="cart">장바구니(0)</div>
    </header>

    <div class="banner">
        <div class="bbb">
            <h1>가을 신상 세일</h1>
            <p>최대 50% 할인</p>
        </div>
    </div>

    <h2 class="title">상품 목록</h2>

    <div class="list">

        <div class="item">
            <span class="badge new">NEW</span>
            <div class="img">이미지</div>
            <p>티셔츠</p>
            <p>15,000원</p>
        </div>

        <div class="item">
            <span class="badge sale">SALE</span>
            <div class="img">이미지</div>
            <p>청바지</p>
            <p>30,000원</p>
        </div>

        <div class="item">
            <span class="badge new">NEW</span>
            <div class="img">이미지</div>
            <p>후드티</p>
            <p>25,000원</p>
        </div>

        <div class="item">
            <span class="badge sale">SALE</span>
            <div class="img">이미지</div>
            <p>자켓</p>
            <p>50,000원</p>
        </div>

        <div class="item">
            <span class="badge sale">SALE</span>
            <div class="img">이미지</div>
            <p>운동화</p>
            <p>40,000원</p>
        </div>

        <div class="item">
            <span class="badge new">NEW</span>
            <div class="img">이미지</div>
            <p>가방</p>
            <p>35,000원</p>
        </div>

        <div class="item">
            <span class="badge new">NEW</span>
            <div class="img">이미지</div>
            <p>모자</p>
            <p>12,000원</p>
        </div>

        <div class="item">
            <span class="badge sale">SALE</span>
            <div class="img">이미지</div>
            <p>양말</p>
            <p>3,000원</p>
        </div>

    </div>

</body>
</html>
